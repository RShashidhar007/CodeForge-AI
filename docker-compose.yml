# CodeForge AI development stack: SQL Server, Redis, Spring Boot backend.
# Run the frontend separately (see README): cd frontend && npm install && npm run dev
services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: recruitment-platform-mssql
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:-Admin@123456}
    ports:
      - "1433:1433"
    volumes:
      - recruitment_platform_mssqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  # SQL Server does not create databases from environment variables, so create
  # it once here. Tables are created by Hibernate (spring.jpa.hibernate.ddl-auto).
  mssql-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: recruitment-platform-db-init
    restart: "no"
    depends_on:
      mssql:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:-Admin@123456}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - /opt/mssql-tools18/bin/sqlcmd -S mssql -U sa -P "$$MSSQL_SA_PASSWORD" -C -b -Q "IF DB_ID('recruitment_platform') IS NULL CREATE DATABASE recruitment_platform"

  redis:
    image: redis:7-alpine
    container_name: recruitment-platform-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - recruitment_platform_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: recruitment-platform-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_HOST: mssql
      DB_PASSWORD: ${DB_PASSWORD:-Admin@123456}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-long-secret-at-least-32-characters-minimum}
      JWT_EXPIRATION_SECONDS: 86400
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin123!}
      ADMIN_NAME: Platform Admin
      # AI: the current backend implements mock responses only (see README).
      LLM_PROVIDER: mock
      LLM_MODEL: gpt-4-turbo
      LLM_API_KEY: ${LLM_API_KEY:-sk-test-key}
      EMBEDDING_PROVIDER: mock
      EMBEDDING_MODEL: text-embedding-3-small
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-sk-test-key}
    depends_on:
      mssql-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      # The app's context path is /api, so the health endpoint is /api/actuator/health
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/api/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  recruitment_platform_mssqldata:
  recruitment_platform_redisdata:
