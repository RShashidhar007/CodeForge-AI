# Complete development stack: MSSQL Server, Redis, and FastAPI backend
services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: recruitment-platform-mssql
    restart: unless-stopped
    environment:
      ACCEPT_EULA: Y
      SA_PASSWORD: "Admin@123456"
      MSSQL_DB: recruitment_platform
    ports:
      - "1433:1433"
    volumes:
      - recruitment_platform_mssqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Admin@123456 -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s

  redis:
    image: redis:7-alpine
    container_name: recruitment-platform-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - recruitment_platform_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: recruitment-platform-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_URL: mssql+pyodbc://sa:Admin@123456@mssql:1433/recruitment_platform?driver=ODBC+Driver+17+for+SQL+Server&TrustServerCertificate=yes&timeout=30&connect_timeout=30
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-long-secret-at-least-32-characters}
      JWT_EXPIRATION_SECONDS: 86400
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin123!}
      ADMIN_NAME: Platform Admin
      PORT: 8080
      # Month 2: AI & LLM configuration
      LLM_PROVIDER: mock
      LLM_MODEL: gpt-4-turbo
      LLM_API_KEY: ${LLM_API_KEY:-sk-test-key}
      EMBEDDING_PROVIDER: mock
      EMBEDDING_MODEL: text-embedding-3-small
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-sk-test-key}
      EMBEDDING_DIMENSION: 1536
      REDIS_URL: redis://redis:6379
    depends_on:
      mssql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Uncomment to run frontend in Docker
  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #   container_name: recruitment-platform-frontend
  #   restart: unless-stopped
  #   ports:
  #     - "5173:5173"
  #   environment:
  #     VITE_API_BASE_URL: http://localhost:8080/api
  #   depends_on:
  #     - backend

volumes:
  recruitment_platform_mssqldata:
  recruitment_platform_redisdata:
