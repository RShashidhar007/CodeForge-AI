# Complete development stack: PostgreSQL + pgvector, Redis, and FastAPI backend
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: recruitment-platform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: recruitment_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: change-me
    ports:
      - "5432:5432"
    volumes:
      - recruitment_platform_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: recruitment-platform-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - recruitment_platform_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: recruitment-platform-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_URL: postgresql://postgres:change-me@postgres:5432/recruitment_platform
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-long-secret-at-least-32-characters}
      JWT_EXPIRATION_SECONDS: 86400
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin123!}
      ADMIN_NAME: Platform Admin
      PORT: 8080
      # Month 2: AI & LLM configuration
      LLM_PROVIDER: openai
      LLM_MODEL: gpt-4-turbo
      LLM_API_KEY: ${LLM_API_KEY:-sk-test-key}
      EMBEDDING_MODEL: text-embedding-3-small
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-sk-test-key}
      EMBEDDING_DIMENSION: 1536
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Uncomment to run frontend in Docker
  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #   container_name: recruitment-platform-frontend
  #   restart: unless-stopped
  #   ports:
  #     - "5173:5173"
  #   environment:
  #     VITE_API_BASE_URL: http://localhost:8080/api
  #   depends_on:
  #     - backend

volumes:
  recruitment_platform_pgdata:
  recruitment_platform_redisdata:
