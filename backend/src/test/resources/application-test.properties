# Test configuration for Spring Boot tests
# Uses H2 in-memory database instead of MSSQL

# Server
server.port=0

# Database - H2 in-memory
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Redis - embedded for testing
spring.redis.host=localhost
spring.redis.port=6379

# JWT
app.jwt.secret=test-secret-key-with-at-least-32-characters-for-testing
app.jwt.expiration=86400

# CORS
app.cors.allowed-origins=http://localhost:5173

# Admin
app.admin.email=admin@test.com
app.admin.password=TestPassword123!
app.admin.name=Test Admin

# Logging
logging.level.com.codeforge=DEBUG
logging.level.org.springframework.security=DEBUG
