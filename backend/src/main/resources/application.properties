# Spring Boot Server Configuration
server.port=8080
server.servlet.context-path=/api

# Application Name
spring.application.name=codeforge-backend

# ===========================
# Database Configuration
# ===========================
spring.datasource.url=jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:recruitment_platform};encrypt=true;trustServerCertificate=true;
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:Admin@123456}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Flyway Database Migration Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.out-of-order=false
spring.flyway.validate-on-migrate=true

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
# Use 'validate' now that Flyway manages schema migrations
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.generate_statistics=false

# Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# ===========================
# Redis Configuration
# ===========================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=60000ms
spring.cache.type=redis
spring.cache.redis.time-to-live=3600000

# ===========================
# JWT Configuration
# ===========================
app.jwt.secret=${JWT_SECRET:your-secret-key-must-be-at-least-32-characters-long-change-in-production}
app.jwt.expiration=${JWT_EXPIRATION_SECONDS:86400}
app.jwt.algorithm=HS256

# ===========================
# CORS Configuration
# ===========================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# ===========================
# Admin Bootstrap Configuration
# ===========================
app.admin.email=${ADMIN_EMAIL:admin@example.com}
app.admin.password=${ADMIN_PASSWORD:Admin123!}
app.admin.name=${ADMIN_NAME:Platform Admin}

# ===========================
# AI/LLM Configuration
# ===========================
app.ai.llm.provider=${LLM_PROVIDER:mock}
app.ai.llm.model=${LLM_MODEL:gpt-4-turbo}
app.ai.llm.api-key=${LLM_API_KEY:sk-test-key}
app.ai.llm.max-tokens=2000
app.ai.llm.temperature=0.7

app.ai.embedding.provider=${EMBEDDING_PROVIDER:mock}
app.ai.embedding.model=${EMBEDDING_MODEL:text-embedding-3-small}
app.ai.embedding.api-key=${EMBEDDING_API_KEY:sk-test-key}
app.ai.embedding.dimension=1536

# ===========================
# GitHub OAuth Configuration
# ===========================
app.github.client-id=${GITHUB_CLIENT_ID:}
app.github.client-secret=${GITHUB_CLIENT_SECRET:}
app.github.oauth-callback-url=${GITHUB_OAUTH_CALLBACK_URL:http://localhost:5173/github/callback}

# ===========================
# Qdrant Vector Database Configuration
# ===========================
app.qdrant.host=${QDRANT_HOST:localhost}
app.qdrant.port=${QDRANT_PORT:6334}
app.qdrant.api-key=${QDRANT_API_KEY:}
app.qdrant.collection-name=${QDRANT_COLLECTION_NAME:code_embeddings}

# ===========================
# Logging Configuration
# ===========================
logging.level.root=INFO
logging.level.com.codeforge=DEBUG
logging.level.org.springframework.security=INFO

# ===========================
# Health Check
# ===========================
# Note: there is no spring-boot-starter-actuator dependency in this project.
# GET /api/actuator/health is served by HealthController (a plain
# @RestController), not by real Spring Boot Actuator. If you add the
# actuator starter later, remove HealthController first to avoid a
# duplicate-mapping conflict on /actuator/health, and reinstate
# management.* properties here.
